# .pre-commit-config.yaml
# Pre-commit hooks for DevSecOps: Security, linting, and code quality
# Install: pip install pre-commit
# Setup:   pre-commit install
# Run:     pre-commit run --all-files
# Docs:    https://pre-commit.com/

repos:
  # ───────────────────────────────────────────────────────────
  # SECURITY: Secrets Detection
  # ───────────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
        name: 🔒 Detect hardcoded secrets
        description: Scans staged files for secrets using Gitleaks
        entry: gitleaks protect --verbose --redact --staged
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # ───────────────────────────────────────────────────────────
  # SECURITY: General file checks
  # ───────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Prevent committing large files (accidentally)
      - id: check-added-large-files
        args: ['--maxkb=1000']
        name: 📦 Block large files (>1MB)

      # Prevent case-sensitivity conflicts
      - id: check-case-conflict
        name: 🔠 Check case conflicts

      # Detect AWS credentials in files
      - id: detect-aws-credentials
        name: ☁️ Detect AWS credentials

      # Detect private keys
      - id: detect-private-key
        name: 🔑 Detect private keys

      # Prevent adding merge conflict markers
      - id: check-merge-conflict
        name: ⚠️ Check merge conflicts

      # Ensure files end with newline
      - id: end-of-file-fixer
        name: 📝 Fix EOF newline

      # Trim trailing whitespace
      - id: trailing-whitespace
        name: ✂️ Trim trailing whitespace

      # Validate JSON files
      - id: check-json
        name: ✅ Validate JSON

      # Validate YAML files
      - id: check-yaml
        name: ✅ Validate YAML

      # Prevent new submodules
      - id: forbid-new-submodules
        name: 🚫 Block new submodules

  # ───────────────────────────────────────────────────────────
  # SECURITY: Dockerfile linting
  # ───────────────────────────────────────────────────────────
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        name: 🐳 Lint Dockerfile
        args: ['--config', '.hadolint.yaml']
        files: Dockerfile
        types: [file]

  # ───────────────────────────────────────────────────────────
  # SECURITY: IaC scanning (Terraform)
  # ───────────────────────────────────────────────────────────
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.0
    hooks:
      - id: checkov
        name: 🏗️ Checkov IaC scan
        files: \.(tf|tfvars|json|yaml|yml)$
        args: [--compact, --quiet]

  # ───────────────────────────────────────────────────────────
  # CODE QUALITY: Python
  # ───────────────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        name: 🐍 Bandit security scan
        args: ["-c", "bandit.yaml"]
        files: \.py$

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        name: ⚫ Black formatter
        language_version: python3

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.0
    hooks:
      - id: isort
        name: 📊 isort import sorting

  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: 🧹 Flake8 lint

  # ───────────────────────────────────────────────────────────
  # CODE QUALITY: JavaScript / TypeScript / Node.js
  # ───────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.0.0
    hooks:
      - id: eslint
        name: 📘 ESLint
        files: \.[jt]sx?$
        types: [file]
        additional_dependencies:
          - eslint@9
          - eslint-config-prettier
          - eslint-plugin-security
          - typescript
          - typescript-eslint

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: 💅 Prettier formatter
        files: \.[jt]sx?|\.json$|\.yaml$|\.yml$|\.md$

  # ───────────────────────────────────────────────────────────
  # CODE QUALITY: Terraform / Infrastructure
  # ───────────────────────────────────────────────────────────
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.88.0
    hooks:
      - id: terraform_fmt
        name: 🏗️ Terraform fmt
      - id: terraform_validate
        name: ✅ Terraform validate
      - id: terraform_tflint
        name: 🧹 Terraform lint

  # ───────────────────────────────────────────────────────────
  # CODE QUALITY: Go
  # ───────────────────────────────────────────────────────────
  - repo: https://github.com/golangci/golangci-lint
    rev: v1.56.0
    hooks:
      - id: golangci-lint
        name: 🐹 golangci-lint
        files: \.go$
        types: [file]

  # ───────────────────────────────────────────────────────────
  # CODE QUALITY: Shell scripts
  # ───────────────────────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0
    hooks:
      - id: shellcheck
        name: 🐚 ShellCheck
        files: \.(sh|bash)$

  # ───────────────────────────────────────────────────────────
  # COMMIT MESSAGE: Enforce conventional commits
  # ───────────────────────────────────────────────────────────
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        name: 📝 Commit message format
        stages: [commit-msg]

  # ───────────────────────────────────────────────────────────
  # LOCAL HOOK: Custom security checks
  # ───────────────────────────────────────────────────────────
  - repo: local
    hooks:
      # Check for TODO/FIXME with security context
      - id: security-todo-check
        name: 🔍 Security TODO check
        entry: bash -c 'if git diff --cached -p -- | grep -i "TODO.*security\|FIXME.*security"; then echo "⚠️ Found security TODO - review before commit"; exit 1; fi'
        language: system
        pass_filenames: false
        stages: [pre-commit]

# ───────────────────────────────────────────────────────────
# DEFAULT BEHAVIOR
# ───────────────────────────────────────────────────────────
default_stages: [pre-commit, pre-push]
default_install_hook_types: [pre-commit, commit-msg]

# Exclude files that are safe to ignore
default_language_version:
  python: python3

# fail_fast: true  # Set to true to stop at first failure
